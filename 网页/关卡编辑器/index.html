<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BoxPush Level Editor</title>
  <link rel="stylesheet" href="editor.css" />
</head>
<body>
  <div class="app">
    <header class="menubar">
      <span class="brand">BoxPush</span>
      <span class="menu-item">File</span>
      <span class="menu-item">Edit</span>
      <span class="menu-item">Window</span>
    </header>

    <aside class="panel outliner">
      <div class="panel-tabs">
        <span class="tab is-active">Levels</span>
      </div>
      <div class="panel-toolbar">
        <button type="button" id="btn-new" title="New Level">+ New</button>
        <input id="level-filter" type="search" placeholder="Search Levels" autocomplete="off" />
      </div>
      <div id="level-list" class="outliner-list" role="tree" aria-label="Levels"></div>
    </aside>

    <main class="stage">
      <div class="stage-bar">
        <button type="button" id="btn-play" class="play">PIE</button>
        <button type="button" id="btn-stop" disabled>Stop</button>
        <button type="button" id="btn-restart" disabled>Restart</button>
        <button type="button" id="btn-undo" disabled>Undo</button>
        <span class="sep"></span>
        <button type="button" id="btn-validate">Validate</button>
        <span id="hud" class="hud">Edit</span>
      </div>
      <canvas id="world" aria-label="Level Viewport"></canvas>
    </main>

    <aside class="panel details">
      <div class="panel-tabs">
        <span class="tab is-active">Details</span>
      </div>
      <div id="details-asset" class="details-asset">ULevelData</div>
      <form class="details-form" id="meta">
        <section class="cat">
          <h2>Display</h2>
          <label class="prop"><span>LevelId</span><input id="field-id" type="text" readonly /></label>
          <label class="prop"><span>DisplayName</span><input id="field-name" type="text" maxlength="24" /></label>
          <label class="prop prop-stack"><span>DesignerNote</span><textarea id="field-note" rows="3" maxlength="200"></textarea></label>
        </section>
        <section class="cat">
          <h2>Rules</h2>
          <label class="prop"><span>Width</span><input id="field-w" type="number" min="5" max="20" /></label>
          <label class="prop"><span>Height</span><input id="field-h" type="number" min="5" max="20" /></label>
          <label class="prop"><span>bListed</span><input id="field-listed" type="checkbox" /></label>
        </section>
        <section class="cat">
          <h2>Placement</h2>
          <div class="prop"><span>PlayerSpawn</span><b id="field-spawn">—</b></div>
          <div class="prop"><span>Instances</span><b id="field-count">0</b></div>
        </section>
        <div class="details-actions">
          <button type="button" id="btn-delete">Delete Asset</button>
        </div>
      </form>
    </aside>

    <footer class="dock">
      <div class="panel-tabs dock-tabs">
        <span class="tab is-active">Content Browser</span>
      </div>
      <div class="cb-toolbar">
        <span id="cb-path" class="cb-path">/Game</span>
        <input id="asset-filter" type="search" placeholder="Search Assets" autocomplete="off" />
      </div>
      <div class="cb-body">
        <nav id="cb-folders" class="cb-folders" aria-label="Asset folders"></nav>
        <div id="cb-grid" class="cb-grid" role="listbox" aria-label="Assets"></div>
      </div>
      <div class="cb-status">
        <span id="cb-count">0 items</span>
        <div id="issues" class="issues" aria-live="polite"></div>
      </div>
    </footer>
  </div>
  <script src="editor.js"></script>
</body>
</html>
