<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>推箱子</title>
  <style>
    :root {
      --bg: #161616;
      --panel: #242424;
      --line: #3a3a3a;
      --text: #e6e6e6;
      --muted: #8d8d8d;
      --accent: #0e7cc0;
      --err: #d15b5b;
      --ok: #8ed49a;
      --gold: #e2c15a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font: 14px/1.45 "Segoe UI", "Microsoft YaHei UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    button, input, textarea { font: inherit; color: var(--text); }
    .screen { min-height: 100%; display: flex; flex-direction: column; }
    .screen[hidden] { display: none; }
    .center { align-items: center; justify-content: center; }
    .menu { width: min(360px, 92vw); display: flex; flex-direction: column; gap: 10px; }
    h1 { margin: 0 0 8px; font-size: 32px; font-weight: 600; letter-spacing: 0.08em; }
    .sub { color: var(--muted); margin: 0 0 16px; }
    .btn {
      background: #333;
      border: 1px solid #4a4a4a;
      padding: 8px 14px;
      cursor: pointer;
    }
    .btn:hover { background: #404040; }
    .btn.primary { background: var(--accent); border-color: #0a5f93; }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn.block { width: 100%; text-align: left; padding: 12px 14px; }
    .topbar, .hud, .play-banner {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px; background: #202020; border-bottom: 1px solid var(--line);
    }
    .grow { flex: 1; }
    .muted { color: var(--muted); }
    .select-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 8px;
      padding: 16px;
    }
    .card {
      text-align: left;
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 12px;
      cursor: pointer;
    }
    .card:hover { border-color: #666; }
    .card.lock { opacity: 0.45; cursor: default; }
    .card .no { color: var(--muted); font-size: 12px; }
    .stars { color: var(--gold); letter-spacing: 2px; }
    .stage { flex: 1; display: grid; place-items: center; overflow: auto; padding: 24px; }
    .overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.62);
      display: grid; place-items: center;
    }
    .overlay[hidden] { display: none; }
    .dialog { width: min(360px, 92vw); background: #2a2a2a; border: 1px solid var(--line); padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .play { position: relative; }
    #screen-settings .menu input[type="range"] { width: 100%; }
    .editor { min-height: 100%; }
    .editor-body {
      flex: 1; min-height: 0;
      display: grid;
      grid-template-columns: 200px minmax(0, 1fr) 280px;
      grid-template-rows: minmax(0, 1fr) 168px auto;
    }
    .col.levels { grid-column: 1; grid-row: 1; }
    .vp { grid-column: 2; grid-row: 1; }
    .col.details { grid-column: 3; grid-row: 1 / 3; border-right: none; border-left: 1px solid var(--line); }
    .cb { grid-column: 1 / 3; grid-row: 2; background: #1c1c1c; border-top: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
    .cb-bar { display: flex; gap: 6px; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--line); }
    .cb-grid { display: flex; gap: 8px; padding: 8px; overflow: auto; }
    .unit-tile {
      width: 92px; flex: 0 0 92px; background: #2a2a2a; border: 1px solid var(--line);
      padding: 8px 6px; cursor: pointer; text-align: center; color: var(--text);
    }
    .unit-tile.on { border-color: var(--accent); background: #16364a; }
    .unit-tile .mesh { display: block; color: var(--muted); font-size: 10px; margin-top: 4px; }
    .folder { background: transparent; border: 1px solid transparent; color: var(--muted); padding: 2px 8px; cursor: pointer; }
    .folder.on { color: var(--text); border-color: var(--line); }
    .col { background: var(--panel); border-right: 1px solid var(--line); padding: 10px; overflow: auto; }
    .col.right { border-right: none; border-left: 1px solid var(--line); }
    .vp { display: flex; flex-direction: column; min-width: 0; background: #1b1b1b; }
    h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .lv {
      display: block; width: 100%; text-align: left; background: transparent;
      border: 1px solid transparent; padding: 6px 8px; margin-bottom: 2px; cursor: pointer; color: var(--text);
    }
    .lv.active { background: #16364a; border-color: var(--accent); }
    .lv small { display: block; color: var(--muted); }
    .badge { float: right; font-size: 10px; color: var(--muted); }
    .badge.on { color: var(--ok); }
    .brushes { display: flex; flex-wrap: wrap; gap: 4px; }
    .brush {
      display: inline-flex; align-items: center; gap: 6px;
      background: transparent; border: 1px solid transparent; color: var(--text); padding: 3px 8px; cursor: pointer;
    }
    .brush.active { background: #16364a; border-color: var(--accent); }
    .sw { width: 12px; height: 12px; border: 1px solid #111; }
    .sw.floor { background: #6d675c; }
    .sw.wall { background: #8d97a3; }
    .sw.target { background: #6d675c; box-shadow: inset 0 0 0 2px var(--gold); }
    .sw.box { background: #c48a3a; }
    .sw.player { background: #4ec3c7; }
    .sw.eraser { background: #222; }
    .cat { margin: 8px 0; padding: 4px 6px; background: #1c1c1c; border: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    label.field { display: block; margin-bottom: 8px; color: var(--muted); font-size: 11px; }
    label.field input, label.field textarea {
      display: block; width: 100%; margin-top: 3px; background: #1a1a1a; border: 1px solid #4a4a4a; padding: 5px 6px;
    }
    label.field textarea { height: 64px; resize: vertical; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .log { grid-column: 1 / -1; grid-row: 3; border-top: 1px solid var(--line); background: #1a1a1a; max-height: 120px; overflow: auto; padding: 8px 12px; }
    .detail-path { color: #9fd4ff; font-size: 12px; margin-bottom: 8px; }
    .detail-note { color: var(--muted); font-size: 12px; margin: 6px 0; }
    .issue { display: flex; gap: 8px; padding: 3px 0; cursor: pointer; }
    .issue b { width: 36px; color: var(--err); font-size: 12px; }
    .pass { color: var(--ok); }
    .board { position: relative; }
    .iso {
      --rise: 8px; --top: #6d675c; --leftc: #4e493f; --rightc: #3a362f;
      position: absolute; width: 56px; height: 28px; cursor: pointer;
    }
    .iso i { position: absolute; pointer-events: none; }
    .iso .top {
      width: 56px; height: 28px; background: var(--top);
      clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
      transform: translateY(calc(var(--rise) * -1));
    }
    .iso .left, .iso .right { top: 14px; width: 28px; height: var(--rise); }
    .iso .left { left: 0; background: var(--leftc); transform: skewY(26.5deg); transform-origin: top left; }
    .iso .right { left: 28px; background: var(--rightc); transform: skewY(-26.5deg); transform-origin: top right; }
    .iso.wall { --rise: 36px; --top: #9aa4b0; --leftc: #667280; --rightc: #4c5864; }
    .iso.empty { --rise: 2px; --top: #2a2a2a; --leftc: #1c1c1c; --rightc: #161616; }
    .iso .mark {
      left: 20px; top: -2px; width: 16px; height: 10px;
      border: 2px solid var(--gold); border-radius: 50%;
    }
    .iso.hi .top { outline: 2px solid var(--err); }
    .ent {
      position: absolute; pointer-events: none; z-index: 4;
      transition: left .12s linear, top .12s linear;
    }
    .ent.player {
      width: 14px; height: 22px; margin-left: 20px; margin-top: -26px;
      background: #4ec3c7; border-radius: 7px 7px 3px 3px;
    }
    .ent.box {
      width: 28px; height: 16px; margin-left: 14px; margin-top: -22px;
      background: #d7a45a; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
    }
    .ent.box.on { background: #e6c15a; }
    .asset { color: #9fd4ff; font-family: Consolas, monospace; font-size: 12px; }
    .dirty { color: var(--gold); }
  </style>
</head>
<body>
  <section class="screen center" id="screen-menu">
    <div class="menu">
      <h1>推箱子</h1>
      <p class="sub">网页版 · 按定稿功能可玩</p>
      <button class="btn primary block" id="go-play">开始游戏</button>
      <button class="btn block" id="go-editor">关卡编辑器</button>
      <button class="btn block" id="go-settings">设置</button>
      <button class="btn block" id="go-quit">退出</button>
    </div>
  </section>

  <section class="screen" id="screen-select" hidden>
    <div class="topbar">
      <button class="btn" id="select-back">返回</button>
      <strong>选关</strong>
      <span class="muted">通关后解锁下一关</span>
    </div>
    <div class="select-grid" id="select-grid"></div>
  </section>

  <section class="screen center" id="screen-settings" hidden>
    <div class="menu">
      <h1>设置</h1>
      <label class="field">主音量 <span id="vol-label">70</span>
        <input id="vol" type="range" min="0" max="100" value="70" />
      </label>
      <button class="btn block" id="settings-back">返回</button>
    </div>
  </section>

  <section class="screen center" id="screen-quit" hidden>
    <div class="menu">
      <h1>已退出</h1>
      <p class="sub">网页演示停在这里。进度已写在本机。</p>
      <button class="btn primary block" id="quit-back">回到主菜单</button>
    </div>
  </section>

  <section class="screen play" id="screen-play" hidden>
    <div class="play-banner" id="pie-banner" hidden>
      <span>试玩 · 不写存档</span>
      <span class="grow"></span>
      <button class="btn" id="pie-stop">停止试玩</button>
    </div>
    <div class="hud">
      <span id="hud-name">关卡</span>
      <span id="hud-steps">步数 0</span>
      <span class="muted" id="hud-hint"></span>
      <span class="grow"></span>
      <button class="btn" id="btn-undo">撤销</button>
      <button class="btn" id="btn-restart">重开</button>
      <button class="btn" id="btn-pause">暂停</button>
    </div>
    <div class="stage"><div class="board" id="play-board"></div></div>
    <div class="overlay" id="overlay-pause" hidden>
      <div class="dialog">
        <strong>暂停</strong>
        <button class="btn primary" id="pause-resume">继续</button>
        <button class="btn" id="pause-restart">重开</button>
        <button class="btn" id="pause-leave">回选关</button>
      </div>
    </div>
    <div class="overlay" id="overlay-win" hidden>
      <div class="dialog">
        <strong id="win-title">通关</strong>
        <div id="win-steps"></div>
        <div class="stars" id="win-stars"></div>
        <button class="btn" id="win-retry">再玩一次</button>
        <button class="btn primary" id="win-next">下一关</button>
        <button class="btn" id="win-back">回选关</button>
      </div>
    </div>
  </section>

  <section class="screen editor" id="screen-editor" hidden>
    <div class="topbar">
      <strong>BoxLevelEditor</strong>
      <span class="asset" id="doc-tab">LV_01</span>
      <span class="dirty" id="dirty" hidden>未保存</span>
      <span class="grow"></span>
      <button class="btn" id="ed-new">新建</button>
      <button class="btn" id="ed-save">保存</button>
      <button class="btn" id="ed-validate">校验</button>
      <button class="btn primary" id="ed-play">试玩此关</button>
      <button class="btn" id="ed-back">返回菜单</button>
    </div>
    <div class="editor-body">
      <aside class="col levels">
        <h2>关卡</h2>
        <div id="ed-list"></div>
      </aside>
      <div class="vp">
        <div class="topbar">
          <span class="muted" id="ed-size">预览</span>
          <span class="muted" id="ed-status">左键放置当前单位，右键橡皮</span>
        </div>
        <div class="stage"><div class="board" id="ed-board"></div></div>
      </div>
      <aside class="col details" id="details-host"></aside>
      <div class="cb">
        <div class="cb-bar">
          <strong>内容浏览器</strong>
          <span class="muted">/Game/Units</span>
          <button class="folder on" data-folder="全部">全部</button>
          <button class="folder" data-folder="地形">地形</button>
          <button class="folder" data-folder="实体">实体</button>
          <button class="folder" data-folder="工具">工具</button>
        </div>
        <div class="cb-grid" id="cb-grid"></div>
      </div>
      <div class="log" id="ed-log"></div>
    </div>
  </section>

  <script>
    const EMPTY = 0, FLOOR = 1, WALL = 2, TARGET = 3;
    const KEY = "boxpush-web-v1";
    const BRUSH_KEYS = { "1": "wall", "2": "floor", "3": "target", "4": "box", "5": "player", "6": "select", "7": "ice" };
    const UNITS = [
      { id: "floor", folder: "地形", name: "地板", mesh: "SM_Floor", sw: "floor" },
      { id: "wall", folder: "地形", name: "墙", mesh: "SM_Wall", sw: "wall" },
      { id: "target", folder: "地形", name: "目标", mesh: "SM_Target", sw: "target" },
      { id: "ice", folder: "地形", name: "冰面", mesh: "SM_Ice", sw: "floor", extension: true },
      { id: "box", folder: "实体", name: "箱子", mesh: "SM_Box", sw: "box" },
      { id: "player", folder: "实体", name: "玩家", mesh: "SM_Player", sw: "player" },
      { id: "select", folder: "工具", name: "选择", mesh: "点选实例", sw: "eraser" },
      { id: "eraser", folder: "工具", name: "橡皮", mesh: "清除", sw: "eraser" }
    ];

    const BUILTIN = [
      ["LV_01", "推一下", 3, 1, "把箱子直线推上目标。", ["########","#......#","#.P.B.x#","#......#","########"]],
      ["LV_02", "绕过去", 7, 2, "先绕到箱子的推动侧。", ["#######","#.....#","#..x..#","#.B.P.#","#.....#","#######"]],
      ["LV_03", "两个箱子", 8, 3, "两个箱子分别推进。", ["#########","#.......#","#.P.B.x.#","#...B.x.#","#.......#","#########"]],
      ["LV_04", "对准", 5, 4, "站到箱子下方再向上推。", ["##########","#........#","#..B.....#","#.P......#","#..x.....#","#........#","##########"]],
      ["LV_05", "窄道", 8, 5, "箱子要穿过墙下的缺口。", ["##########","#........#","#.P.B....#","#######.##","#......x.#","##########"]],
      ["LV_06", "让位", 11, 6, "先让开，再推另一只箱子。", ["#########","#..x....#","#.B.....#","#..##...#","#.P.B.x.#","#.......#","#########"]],
      ["LV_07", "并排", 9, 7, "两只箱子并排推进。", ["#########","#.......#","#..B.B..#","#.P.x.x.#","#.......#","#########"]],
      ["LV_08", "上下", 12, 8, "上下两间，中间有柱。", ["##########","#........#","#..B..x..#","#.P.#.#..#","#..B..x..#","#........#","##########"]],
      ["LV_09", "隔断", 11, 9, "隔断把两条路分开。", ["###########","#.........#","#.P.B.x...#","#.###.#...#","#...B.x...#","#.........#","###########"]],
      ["LV_10", "双通道", 14, 10, "两条通道，不要推错顺序。", ["############","#..........#","#.P.B..x...#","#..##..#...#","#..B...x...#","#..........#","############"]],
      ["LV_11", "交叉", 19, 11, "左右目标交叉，先腾出位置。", ["###########","#.........#","#..x...x..#","#.B..#..B.#","#..#...#..#","#.P.......#","###########"]],
      ["LV_12", "终局", 23, 12, "先把箱子让出中间的柱子。", ["#############","#...........#","#.P.B.B.....#","#...#.#.....#","#.x...x.....#","#...........#","#############"]]
    ];

    function parseLayout(rows) {
      const h = rows.length, w = rows[0].length;
      const terrain = Array.from({ length: h }, () => Array(w).fill(EMPTY));
      const boxes = [];
      let player = null;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const c = rows[y][x];
        if (c === "#") terrain[y][x] = WALL;
        else if (c === "x" || c === "*" || c === "+") terrain[y][x] = TARGET;
        else if (c === " ") terrain[y][x] = EMPTY;
        else terrain[y][x] = FLOOR;
        if (c === "B" || c === "*") boxes.push({ x, y });
        if (c === "P" || c === "+") player = { x, y };
      }
      return { width: w, height: h, terrain, boxes, player };
    }

    function builtinLevels() {
      return BUILTIN.map(([id, displayName, parMoves, sortOrder, note, rows]) => ({
        id, path: "/Game/Levels/BuiltIn/" + id, displayName, parMoves, sortOrder, note,
        listed: true, dirty: false, ...parseLayout(rows)
      }));
    }

    let save = loadSave();
    let catalog = save.catalog ? save.catalog : builtinLevels();
    let screenName = "menu";
    let play = null;
    let editorIndex = 0;
    let editorLevel = null;
    let brush = "wall";
    let selection = { kind: "level" };
    let cbFolder = "全部";
    let painting = false;
    let highlights = [];
    let audioCtx = null;
    let master = null;

    function loadSave() {
      try { return JSON.parse(localStorage.getItem(KEY)) || {}; }
      catch { return {}; }
    }
    function writeSave() {
      save.catalog = catalog;
      localStorage.setItem(KEY, JSON.stringify(save));
    }
    function progressOf(id) { return (save.progress && save.progress[id]) || null; }

    function ensureAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContext();
        master = audioCtx.createGain();
        master.connect(audioCtx.destination);
      }
      master.gain.value = (save.volume ?? 0.7);
      if (audioCtx.state === "suspended") audioCtx.resume();
    }
    function tone(freq, dur, type, gain) {
      ensureAudio();
      if (master.gain.value <= 0.001) return;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq; g.gain.value = gain;
      o.connect(g); g.connect(master);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.stop(audioCtx.currentTime + dur);
    }
    function sfx(name) {
      if (name === "button") tone(740, 0.04, "square", 0.03);
      if (name === "move") tone(520, 0.05, "square", 0.04);
      if (name === "push") tone(160, 0.08, "sawtooth", 0.05);
      if (name === "win") {
        tone(523, 0.1, "square", 0.04);
        setTimeout(() => tone(659, 0.1, "square", 0.04), 90);
        setTimeout(() => tone(784, 0.16, "square", 0.04), 180);
      }
    }

    function show(name) {
      screenName = name;
      document.querySelectorAll(".screen").forEach((el) => { el.hidden = el.id !== "screen-" + name; });
    }
    function cloneLevel(lv) {
      return { ...lv, terrain: lv.terrain.map((r) => r.slice()), boxes: lv.boxes.map((b) => ({ ...b })), player: lv.player ? { ...lv.player } : null };
    }
    function listedSorted() {
      return catalog.filter((lv) => lv.listed).slice().sort((a, b) => a.sortOrder - b.sortOrder);
    }
    function isUnlocked(lv) {
      const list = listedSorted();
      const i = list.findIndex((x) => x.id === lv.id);
      if (i <= 0) return i === 0;
      return !!progressOf(list[i - 1].id);
    }
    function starsFor(moves, par) {
      if (moves <= par) return 3;
      if (moves <= Math.ceil(par * 1.5)) return 2;
      return 1;
    }
    function starText(n) { return "★".repeat(n) + "☆".repeat(3 - n); }

    function cellOrigin(x, y, h) {
      const tw = 56, th = 28;
      return { left: h * (tw / 2) + (x - y) * (tw / 2), top: 28 + (x + y) * (th / 2) };
    }
    function standable(t) { return t === FLOOR || t === TARGET; }
    function boxAt(x, y, boxes) { return boxes.findIndex((b) => b.x === x && b.y === y); }

    function placeEnts(el, terrain, boxes, player) {
      const h = terrain.length;
      const existing = el.querySelectorAll(".ent");
      const need = boxes.length + (player ? 1 : 0);
      if (existing.length !== need) existing.forEach((node) => node.remove());
      boxes.forEach((b, i) => {
        let ent = el.querySelector(`.ent.box[data-i="${i}"]`);
        if (!ent) {
          ent = document.createElement("div");
          ent.className = "ent box";
          ent.dataset.i = String(i);
          el.appendChild(ent);
        }
        const o = cellOrigin(b.x, b.y, h);
        ent.style.left = o.left + "px";
        ent.style.top = o.top + "px";
        ent.style.zIndex = String(b.x + b.y);
        ent.classList.toggle("on", terrain[b.y] && terrain[b.y][b.x] === TARGET);
      });
      if (player) {
        let ent = el.querySelector(".ent.player");
        if (!ent) {
          ent = document.createElement("div");
          ent.className = "ent player";
          el.appendChild(ent);
        }
        const o = cellOrigin(player.x, player.y, h);
        ent.style.left = o.left + "px";
        ent.style.top = o.top + "px";
        ent.style.zIndex = String(player.x + player.y);
      }
    }

    function paint(el, terrain, boxes, player, interactive) {
      const h = terrain.length, w = terrain[0].length;
      const tw = 56, th = 28;
      el.style.width = (w + h) * (tw / 2) + 40 + "px";
      el.style.height = (w + h) * (th / 2) + 80 + "px";
      el.innerHTML = "";
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const t = terrain[y][x];
        const cell = document.createElement("div");
        const kind = t === WALL ? "wall" : t === TARGET ? "target" : t === EMPTY ? "empty" : "floor";
        const hi = highlights.some((p) => p.x === x && p.y === y) ? " hi" : "";
        cell.className = "iso " + kind + hi;
        const o = cellOrigin(x, y, h);
        cell.style.left = o.left + "px";
        cell.style.top = o.top + "px";
        cell.style.zIndex = String(x + y);
        cell.innerHTML = '<i class="top"></i><i class="left"></i><i class="right"></i>' + (t === TARGET ? '<i class="mark"></i>' : "");
        if (interactive) {
          cell.addEventListener("pointerdown", (e) => {
            e.preventDefault();
            painting = true;
            applyBrush(x, y, e.button === 2, false);
          });
          cell.addEventListener("pointerenter", (e) => {
            if (!painting) return;
            applyBrush(x, y, (e.buttons & 2) === 2, true);
          });
        }
        el.appendChild(cell);
      }
      placeEnts(el, terrain, boxes, player);
    }

    function renderSelect() {
      const grid = document.getElementById("select-grid");
      grid.innerHTML = listedSorted().map((lv) => {
        const open = isUnlocked(lv);
        const prog = progressOf(lv.id);
        const stars = prog ? starText(prog.stars) : "☆☆☆";
        const best = prog ? `最少 ${prog.best} 步` : "未通关";
        return `<button class="card ${open ? "" : "lock"}" data-id="${lv.id}" ${open ? "" : "disabled"}><div class="no">${String(lv.sortOrder).padStart(2, "0")} · 推荐 ${lv.parMoves} 步</div><strong>${lv.displayName}</strong><div class="stars">${open ? stars : "锁定"}</div><div class="muted">${open ? best : "先通关上一关"}</div></button>`;
      }).join("");
      grid.querySelectorAll(".card:not(.lock)").forEach((node) => {
        node.onclick = () => startGame(node.dataset.id, false);
      });
    }

    function startGame(id, pie) {
      const src = catalog.find((lv) => lv.id === id);
      const lv = cloneLevel(src);
      play = {
        id: lv.id, name: lv.displayName, par: lv.parMoves, sortOrder: lv.sortOrder, note: lv.note,
        terrain: lv.terrain, player: { ...lv.player }, boxes: lv.boxes.map((b) => ({ ...b })),
        startPlayer: { ...lv.player }, startBoxes: lv.boxes.map((b) => ({ ...b })),
        undo: [], moves: 0, won: false, pie, busy: false
      };
      highlights = [];
      show("play");
      document.getElementById("pie-banner").hidden = !pie;
      document.getElementById("pause-leave").textContent = pie ? "停止试玩" : "回选关";
      document.getElementById("overlay-pause").hidden = true;
      document.getElementById("overlay-win").hidden = true;
      renderPlay();
    }

    function renderPlay() {
      document.getElementById("hud-name").textContent = play.name;
      document.getElementById("hud-steps").textContent = `步数 ${play.moves} / 推荐 ${play.par}`;
      document.getElementById("hud-hint").textContent = play.sortOrder === 1 ? play.note : "";
      const board = document.getElementById("play-board");
      const sig = play.terrain[0].length + "x" + play.terrain.length + ":" + play.id;
      if (board.dataset.sig !== sig) {
        paint(board, play.terrain, play.boxes, play.player, false);
        board.dataset.sig = sig;
        board.querySelectorAll(".ent").forEach((ent) => { ent.style.transition = "none"; });
        requestAnimationFrame(() => board.querySelectorAll(".ent").forEach((ent) => { ent.style.transition = ""; }));
      } else {
        placeEnts(board, play.terrain, play.boxes, play.player);
      }
    }

    function tryMove(dx, dy) {
      if (!play || play.won || play.busy || !document.getElementById("overlay-pause").hidden || !document.getElementById("overlay-win").hidden) return;
      const x = play.player.x + dx, y = play.player.y + dy;
      const w = play.terrain[0].length, h = play.terrain.length;
      if (x < 0 || y < 0 || x >= w || y >= h) return;
      const t = play.terrain[y][x];
      if (t === WALL || t === EMPTY) return;
      const bi = boxAt(x, y, play.boxes);
      const prev = { player: { ...play.player }, boxes: play.boxes.map((b) => ({ ...b })) };
      let pushed = false;
      if (bi >= 0) {
        const bx = x + dx, by = y + dy;
        if (bx < 0 || by < 0 || bx >= w || by >= h) return;
        const bt = play.terrain[by][bx];
        if (bt === WALL || bt === EMPTY || boxAt(bx, by, play.boxes) >= 0) return;
        play.boxes[bi] = { x: bx, y: by };
        pushed = true;
      }
      play.undo.push(prev);
      play.player = { x, y };
      play.moves += 1;
      play.busy = true;
      sfx(pushed ? "push" : "move");
      const targets = [];
      play.terrain.forEach((row, yy) => row.forEach((cell, xx) => { if (cell === TARGET) targets.push(xx + "," + yy); }));
      play.won = targets.length > 0 && targets.every((tg) => play.boxes.some((b) => b.x + "," + b.y === tg));
      renderPlay();
      setTimeout(() => {
        if (!play) return;
        play.busy = false;
        if (play.won) onWin();
      }, 130);
    }

    function onWin() {
      sfx("win");
      const overlay = document.getElementById("overlay-win");
      overlay.hidden = false;
      if (play.pie) {
        document.getElementById("win-title").textContent = "试玩通过";
        document.getElementById("win-steps").textContent = `步数 ${play.moves}。这次不写玩家存档。`;
        document.getElementById("win-stars").textContent = "";
        document.getElementById("win-next").hidden = true;
        document.getElementById("win-back").textContent = "回到编辑器";
        return;
      }
      const stars = starsFor(play.moves, play.par);
      const prev = progressOf(play.id);
      const best = prev ? Math.min(prev.best, play.moves) : play.moves;
      const bestStars = prev ? Math.max(prev.stars, stars) : stars;
      save.progress = save.progress || {};
      save.progress[play.id] = { best, stars: bestStars };
      writeSave();
      document.getElementById("win-title").textContent = "通关";
      document.getElementById("win-steps").textContent = `步数 ${play.moves} / 推荐 ${play.par}。最少 ${best} 步。`;
      document.getElementById("win-stars").textContent = starText(stars);
      const list = listedSorted();
      const i = list.findIndex((lv) => lv.id === play.id);
      const hasNext = i >= 0 && i < list.length - 1;
      document.getElementById("win-next").hidden = !hasNext;
      document.getElementById("win-back").textContent = "回选关";
    }

    function undoPlay() {
      if (!play || play.busy || play.won) return;
      const prev = play.undo.pop();
      if (!prev) return;
      play.player = prev.player;
      play.boxes = prev.boxes;
      play.moves = Math.max(0, play.moves - 1);
      renderPlay();
    }
    function restartPlay() {
      if (!play) return;
      play.player = { ...play.startPlayer };
      play.boxes = play.startBoxes.map((b) => ({ ...b }));
      play.undo = [];
      play.moves = 0;
      play.won = false;
      play.busy = false;
      document.getElementById("overlay-pause").hidden = true;
      document.getElementById("overlay-win").hidden = true;
      renderPlay();
    }

    function validate(lv) {
      const errors = [];
      const players = lv.player ? 1 : 0;
      const targets = lv.terrain.flat().filter((t) => t === TARGET).length;
      if (players !== 1) errors.push({ text: `玩家数量是 ${players}，必须恰好 1 个`, cells: lv.player ? [lv.player] : [] });
      if (lv.boxes.length !== targets || lv.boxes.length < 1) errors.push({ text: `箱子 ${lv.boxes.length} 个，目标 ${targets} 个，胜利条件无法达成`, cells: lv.boxes });
      if (lv.width < 5 || lv.width > 20 || lv.height < 5 || lv.height > 20) errors.push({ text: "宽或高越界（5–20）" });
      if (!lv.id) errors.push({ text: "LevelId 为空" });
      if (catalog.some((other) => other !== editorLevel && other.id === lv.id)) errors.push({ text: "LevelId 与已有关重复" });
      const bad = [];
      if (lv.player && !standable(lv.terrain[lv.player.y][lv.player.x])) bad.push(lv.player);
      lv.boxes.forEach((b) => { if (!standable(lv.terrain[b.y][b.x])) bad.push(b); });
      if (bad.length) errors.push({ text: "玩家或箱子落在空洞 / 墙上", cells: bad });
      return errors;
    }

    function renderLog(errors) {
      const el = document.getElementById("ed-log");
      if (!errors.length) { el.innerHTML = '<div class="pass">通过。可以上架，也可以试玩。</div>'; return; }
      el.innerHTML = errors.map((e, i) => `<div class="issue" data-i="${i}"><b>错误</b><span>${e.text}</span></div>`).join("");
      el.querySelectorAll(".issue").forEach((node) => {
        node.onclick = () => {
          highlights = errors[Number(node.dataset.i)].cells || [];
          renderEditorBoard();
        };
      });
    }

    function renderEditorBoard() {
      if (!editorLevel) return;
      document.getElementById("ed-size").textContent = `${editorLevel.width} × ${editorLevel.height}`;
      paint(document.getElementById("ed-board"), editorLevel.terrain, editorLevel.boxes, editorLevel.player, true);
    }
    function renderEditorList() {
      const el = document.getElementById("ed-list");
      el.innerHTML = catalog.map((lv, i) => `<button class="lv ${i === editorIndex ? "active" : ""}" data-i="${i}"><span class="badge ${lv.listed ? "on" : ""}">${lv.listed ? "已上架" : "未上架"}</span><b>${lv.id}</b><small>${lv.displayName}</small></button>`).join("");
      el.querySelectorAll(".lv").forEach((node) => { node.onclick = () => openEditor(Number(node.dataset.i)); });
    }
    function unitById(id) { return UNITS.find((u) => u.id === id); }
    function renderContent() {
      const host = document.getElementById("cb-grid");
      host.innerHTML = UNITS.filter((u) => cbFolder === "全部" || u.folder === cbFolder).map((u) =>
        `<button class="unit-tile ${brush === u.id ? "on" : ""}" data-unit="${u.id}"><i class="sw ${u.sw}"></i><div>${u.name}</div><span class="mesh">${u.mesh}</span></button>`
      ).join("");
      host.querySelectorAll(".unit-tile").forEach((node) => {
        node.onclick = () => selectUnit(node.dataset.unit);
      });
    }
    function renderDetails() {
      const host = document.getElementById("details-host");
      if (!editorLevel) return;
      if (selection.kind === "unit") host.innerHTML = unitDetailHtml(unitById(selection.id));
      else if (selection.kind === "instance") host.innerHTML = instanceDetailHtml();
      else host.innerHTML = levelDetailHtml();
      bindDetailInputs();
    }
    function levelDetailHtml() {
      const lv = editorLevel;
      return `<h2>细节 · 关卡</h2><div class="detail-path">${lv.path}</div>
        <div class="cat">显示</div>
        <label class="field">DisplayName<input id="f-name" value="${escapeAttr(lv.displayName)}" /></label>
        <label class="field">SortOrder<input id="f-sort" type="number" min="1" value="${lv.sortOrder}" /></label>
        <div class="cat">规则</div>
        <label class="field">ParMoves<input id="f-par" type="number" min="1" value="${lv.parMoves}" /></label>
        <div class="row2">
          <label class="field">Width<input id="f-w" type="number" min="5" max="20" value="${lv.width}" /></label>
          <label class="field">Height<input id="f-h" type="number" min="5" max="20" value="${lv.height}" /></label>
        </div>
        <div class="cat">策划</div>
        <label class="field">DesignerNote<textarea id="f-note">${escapeText(lv.note)}</textarea></label>`;
    }
    function unitDetailHtml(u) {
      const head = `<h2>细节 · 单位</h2><div class="detail-path">/Game/Units/${u.folder}/${u.name}</div>`;
      const mesh = `<label class="field">模型<input id="f-mesh" value="${escapeAttr(u.mesh)}" /></label>`;
      if (u.id === "wall") return head + mesh + `<p class="detail-note">写入地形层。阻挡移动和推动。上面的玩家、箱子会被清掉。</p>`;
      if (u.id === "floor") return head + mesh + `<p class="detail-note">写入地形层。可站立，不计入胜利。</p>`;
      if (u.id === "target") return head + mesh + `<p class="detail-note">写入地形层。可站立。箱子数必须等于目标数。</p>`;
      if (u.id === "box") return head + mesh + `<p class="detail-note">写入实体层，不覆盖地形。可推动，不能与另一只箱子重叠。再点一次移除。</p>`;
      if (u.id === "player") return head + mesh + `<p class="detail-note">写入实体层。全关只能有一个，新的会替换旧出生点。</p>`;
      if (u.id === "ice") return head + mesh + `<p class="detail-note">扩展单位：已经进内容浏览器和这张定制细节。对局规则还没接，放置不会改关卡。</p>`;
      if (u.id === "select") return head + `<p class="detail-note">不放置。点预览里的格子，细节改成该格最上层单位的实例。</p>`;
      return head + `<p class="detail-note">右键同效。地形回到地板，并清掉该格的玩家或箱子。</p>`;
    }
    function instanceDetailHtml() {
      const u = unitById(selection.id);
      const lv = editorLevel;
      const t = lv.terrain[selection.y][selection.x];
      const terrainName = t === WALL ? "墙" : t === TARGET ? "目标" : t === EMPTY ? "空洞" : "地板";
      const title = t === EMPTY ? "空洞" : u.name;
      return `<h2>细节 · 实例</h2><div class="detail-path">${title} (${selection.x}, ${selection.y})</div>
        <p class="detail-note">这格地形是${terrainName}。模型来自单位定义 ${u.mesh}。</p>
        <button class="btn" id="inst-delete">删除此实例</button>
        <p class="detail-note"><button class="btn" id="back-level">回到关卡细节</button></p>`;
    }
    function escapeAttr(s) { return String(s ?? "").replace(/"/g, "&quot;"); }
    function escapeText(s) { return String(s ?? "").replace(/</g, "&lt;"); }
    function bindDetailInputs() {
      const name = document.getElementById("f-name");
      if (name) {
        const onMeta = () => {
          editorLevel.displayName = document.getElementById("f-name").value;
          editorLevel.parMoves = Number(document.getElementById("f-par").value);
          editorLevel.sortOrder = Number(document.getElementById("f-sort").value);
          editorLevel.note = document.getElementById("f-note").value;
          markDirty();
          renderEditorList();
        };
        ["f-name", "f-par", "f-sort", "f-note"].forEach((id) => document.getElementById(id).addEventListener("input", onMeta));
        document.getElementById("f-w").addEventListener("change", () => resizeTo(Number(document.getElementById("f-w").value), Number(document.getElementById("f-h").value)));
        document.getElementById("f-h").addEventListener("change", () => resizeTo(Number(document.getElementById("f-w").value), Number(document.getElementById("f-h").value)));
      }
      const mesh = document.getElementById("f-mesh");
      if (mesh) mesh.addEventListener("input", () => {
        unitById(selection.id).mesh = mesh.value;
        renderContent();
      });
      const del = document.getElementById("inst-delete");
      if (del) del.onclick = () => { applyBrush(selection.x, selection.y, true, false); selection = { kind: "unit", id: brush }; renderDetails(); };
      const back = document.getElementById("back-level");
      if (back) back.onclick = () => { selection = { kind: "level" }; highlights = []; renderDetails(); renderEditorBoard(); };
    }
    function selectUnit(id) {
      brush = id;
      selection = { kind: "unit", id };
      const u = unitById(id);
      document.getElementById("ed-status").textContent = u.extension ? "冰面未接入对局，放置不会改格子" : (id === "select" ? "点格子可选中实例" : "左键放置「" + u.name + "」，右键橡皮");
      renderContent();
      renderDetails();
    }
    function selectCell(x, y) {
      const lv = editorLevel;
      let id = "floor";
      if (lv.player && lv.player.x === x && lv.player.y === y) id = "player";
      else if (boxAt(x, y, lv.boxes) >= 0) id = "box";
      else if (lv.terrain[y][x] === WALL) id = "wall";
      else if (lv.terrain[y][x] === TARGET) id = "target";
      else if (lv.terrain[y][x] === EMPTY) id = "floor";
      selection = { kind: "instance", id, x, y };
      highlights = [{ x, y }];
      renderDetails();
      renderEditorBoard();
    }
    function syncChrome() {
      document.getElementById("doc-tab").textContent = editorLevel.path;
      document.getElementById("dirty").hidden = !editorLevel.dirty;
    }
    function openEditor(i) {
      editorIndex = i;
      editorLevel = catalog[i];
      highlights = [];
      selection = { kind: "level" };
      show("editor");
      syncChrome();
      renderEditorList();
      renderEditorBoard();
      renderContent();
      renderDetails();
      renderLog(validate(editorLevel));
    }
    function markDirty() {
      editorLevel.dirty = true;
      document.getElementById("dirty").hidden = false;
    }
    function applyBrush(x, y, isRight, fromDrag) {
      const lv = editorLevel;
      const use = isRight ? "eraser" : brush;
      if (use === "select") { if (!fromDrag) selectCell(x, y); return; }
      if (use === "ice") {
        document.getElementById("ed-status").textContent = "冰面只完成了编辑器注册，没有写入关卡";
        return;
      }
      if (fromDrag && (use === "box" || use === "player")) return;
      const t = lv.terrain[y][x];
      if (use === "floor") lv.terrain[y][x] = FLOOR;
      if (use === "wall") lv.terrain[y][x] = WALL;
      if (use === "target") lv.terrain[y][x] = TARGET;
      if (use === "eraser") {
        lv.terrain[y][x] = t === EMPTY ? EMPTY : FLOOR;
        lv.boxes = lv.boxes.filter((b) => !(b.x === x && b.y === y));
        if (lv.player && lv.player.x === x && lv.player.y === y) lv.player = null;
      }
      if (use === "box") {
        const i = boxAt(x, y, lv.boxes);
        if (i >= 0) lv.boxes.splice(i, 1);
        else {
          if (!standable(lv.terrain[y][x])) lv.terrain[y][x] = FLOOR;
          lv.boxes.push({ x, y });
        }
      }
      if (use === "player") {
        if (!standable(lv.terrain[y][x])) lv.terrain[y][x] = FLOOR;
        lv.player = { x, y };
      }
      if (["floor", "wall", "target"].includes(use) && !standable(lv.terrain[y][x])) {
        lv.boxes = lv.boxes.filter((b) => !(b.x === x && b.y === y));
        if (lv.player && lv.player.x === x && lv.player.y === y) lv.player = null;
      }
      highlights = [];
      markDirty();
      renderEditorBoard();
    }
    function resizeTo(nw, nh) {
      nw = Math.max(5, Math.min(20, nw | 0));
      nh = Math.max(5, Math.min(20, nh | 0));
      const lv = editorLevel;
      const lost = [];
      if (lv.player && (lv.player.x >= nw || lv.player.y >= nh)) lost.push("玩家");
      if (lv.boxes.some((b) => b.x >= nw || b.y >= nh)) lost.push("箱子");
      if (lost.length && !confirm(`改尺寸会裁掉：${lost.join("、")}。确定？`)) {
        document.getElementById("f-w").value = lv.width;
        document.getElementById("f-h").value = lv.height;
        return;
      }
      const next = Array.from({ length: nh }, (_, y) => Array.from({ length: nw }, (_, x) => (y < lv.height && x < lv.width) ? lv.terrain[y][x] : FLOOR));
      lv.terrain = next;
      lv.width = nw; lv.height = nh;
      if (lv.player && (lv.player.x >= nw || lv.player.y >= nh)) lv.player = null;
      lv.boxes = lv.boxes.filter((b) => b.x < nw && b.y < nh);
      markDirty();
      renderEditorBoard();
    }
    function defaultLevel() {
      const w = 8, h = 8;
      const terrain = Array.from({ length: h }, () => Array(w).fill(FLOOR));
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (x === 0 || y === 0 || x === w - 1 || y === h - 1) terrain[y][x] = WALL;
      terrain[3][5] = TARGET;
      const n = catalog.length + 1;
      return {
        id: "LV_Custom_" + n, path: "/Game/Levels/BuiltIn/LV_Custom_" + n,
        displayName: "未命名关卡", parMoves: 8, sortOrder: n, note: "",
        listed: false, dirty: true, width: w, height: h, terrain,
        player: { x: 2, y: 3 }, boxes: [{ x: 3, y: 3 }]
      };
    }

    function bind() {
      document.body.addEventListener("click", (e) => { if (e.target.closest("button")) sfx("button"); });
      document.getElementById("go-play").onclick = () => { show("select"); renderSelect(); };
      document.getElementById("go-editor").onclick = () => openEditor(editorIndex || 0);
      document.getElementById("go-settings").onclick = () => show("settings");
      document.getElementById("go-quit").onclick = () => show("quit");
      document.getElementById("select-back").onclick = () => show("menu");
      document.getElementById("settings-back").onclick = () => show("menu");
      document.getElementById("quit-back").onclick = () => show("menu");
      const vol = document.getElementById("vol");
      vol.value = Math.round((save.volume ?? 0.7) * 100);
      document.getElementById("vol-label").textContent = vol.value;
      vol.oninput = () => {
        save.volume = Number(vol.value) / 100;
        document.getElementById("vol-label").textContent = vol.value;
        if (master) master.gain.value = save.volume;
        writeSave();
      };

      document.getElementById("btn-undo").onclick = undoPlay;
      document.getElementById("btn-restart").onclick = restartPlay;
      document.getElementById("btn-pause").onclick = () => { document.getElementById("overlay-pause").hidden = false; };
      document.getElementById("pause-resume").onclick = () => { document.getElementById("overlay-pause").hidden = true; };
      document.getElementById("pause-restart").onclick = restartPlay;
      document.getElementById("pause-leave").onclick = () => {
        const pie = play && play.pie;
        play = null;
        if (pie) show("editor"); else { show("select"); renderSelect(); }
      };
      document.getElementById("pie-stop").onclick = () => { play = null; show("editor"); };
      document.getElementById("win-retry").onclick = restartPlay;
      document.getElementById("win-next").onclick = () => {
        const list = listedSorted();
        const i = list.findIndex((lv) => lv.id === play.id);
        startGame(list[i + 1].id, false);
      };
      document.getElementById("win-back").onclick = () => {
        const pie = play && play.pie;
        play = null;
        if (pie) show("editor"); else { show("select"); renderSelect(); }
      };

      document.querySelector(".cb-bar").onclick = (e) => {
        const folder = e.target.closest(".folder");
        if (!folder) return;
        cbFolder = folder.dataset.folder;
        document.querySelectorAll(".folder").forEach((el) => el.classList.toggle("on", el.dataset.folder === cbFolder));
        renderContent();
      };
      document.getElementById("ed-board").addEventListener("contextmenu", (e) => e.preventDefault());
      window.addEventListener("pointerup", () => { painting = false; });
      document.getElementById("ed-back").onclick = () => show("menu");
      document.getElementById("ed-new").onclick = () => {
        catalog.push(defaultLevel());
        openEditor(catalog.length - 1);
      };
      document.getElementById("ed-validate").onclick = () => {
        highlights = [];
        renderLog(validate(editorLevel));
        renderEditorBoard();
      };
      document.getElementById("ed-save").onclick = () => {
        const errors = validate(editorLevel);
        editorLevel.listed = errors.length === 0;
        editorLevel.dirty = false;
        catalog[editorIndex] = editorLevel;
        writeSave();
        syncChrome();
        renderEditorList();
        if (selection.kind === "level") renderDetails();
        renderLog(errors);
      };
      document.getElementById("ed-play").onclick = () => {
        const errors = validate(editorLevel);
        renderLog(errors);
        if (errors.length) return;
        catalog[editorIndex] = editorLevel;
        startGame(editorLevel.id, true);
      };
      window.addEventListener("keydown", (e) => {
        const typing = document.activeElement && (document.activeElement.tagName === "INPUT" || document.activeElement.tagName === "TEXTAREA");
        if (screenName === "play" && play) {
          const map = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], a: [-1, 0], s: [0, 1], d: [1, 0], W: [0, -1], A: [-1, 0], S: [0, 1], D: [1, 0] };
          if (map[e.key]) { e.preventDefault(); tryMove(...map[e.key]); }
          if (e.key === "z" || e.key === "Z") undoPlay();
          if (e.key === "r" || e.key === "R") restartPlay();
          if (e.key === "Escape") {
            const pause = document.getElementById("overlay-pause");
            pause.hidden = !pause.hidden;
          }
          return;
        }
        if (screenName === "editor" && !typing && BRUSH_KEYS[e.key]) selectUnit(BRUSH_KEYS[e.key]);
      });
    }

    bind();
    show("menu");
  </script>
</body>
</html>
